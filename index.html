        const formatDateObj = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const getStartOfWeek = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        };

        const downloadCSV = (data, filename, headers) => {
            let csvContent = "\uFEFF";
            csvContent += headers.map(h => `"${h}"`).join(";") + "\n";
            if (data && data.length > 0) {
                data.forEach(row => {
                    const rowData = Object.values(row).map(val => `"${val}"`).join(";");
                    csvContent += rowData + "\n";
                });
            }
            const encodedUri = "data:text/csv;charset=utf-8," + encodeURIComponent(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${filename}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        function AttendanceJournal({ locale, childrenList, lessons, currentDate, setCurrentDate, onAddChild, onDeleteChild, onUpdateStatus }) {
            const t = translations[locale];
            const [cellMenu, setCellMenu] = useState(null);
            const [newChildName, setNewChildName] = useState('');

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysArray = Array.from({ length: daysInMonth }, (_, i) => i + 1);

            const changeMonth = (offset) => {
                const newDate = new Date(currentDate);
                newDate.setMonth(newDate.getMonth() + offset);
                setCurrentDate(newDate);
            };

            const handleAdd = () => {
                if (!newChildName.trim()) return;
                onAddChild(newChildName.trim());
                setNewChildName('');
            };

            const getStatusForDay = (childName, day) => {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const lesson = lessons.find(l => l.date === dateStr && l.children.includes(childName));
                if (!lesson) return null;
                const status = lesson.attendance?.[childName];
                if (status === 'attended') return 'П';
                if (status === 'missed') return 'Н';
                if (status === 'cancelled') return 'О';
                return null;
            };

            const handleCellClick = (childName, day) => {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const lesson = lessons.find(l => l.date === dateStr && l.children.includes(childName));
                if (!lesson) { alert(t.noLessonForDay); return; }
                const currentStatus = lesson.attendance?.[childName] || 'pending';
                setCellMenu({ childName, day, lessonId: lesson.id, currentStatus });
            };

            const handleStatusSelect = (newStatus) => {
                if (!cellMenu) return;
                onUpdateStatus(cellMenu.lessonId, cellMenu.childName, newStatus);
                setCellMenu(null);
            };

            const getCellStyle = (status) => {
                if (status === 'П') return 'bg-green-200 dark:bg-green-900/50 text-green-900 dark:text-green-100 font-bold';
                if (status === 'Н') return 'bg-red-200 dark:bg-red-900/50 text-red-900 dark:text-red-100 font-bold';
                if (status === 'О') return 'bg-yellow-200 dark:bg-yellow-900/50 text-yellow-900 dark:text-yellow-100 font-bold';
                return 'bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 text-transparent';

            return (

                                <div className="text-center font-cursive text-2xl text-brand-red w-32">{t.months[month]} {year}</div>
                                <button onClick={() => changeMonth(1)} className="text-brand-wood dark:text-gray-300 hover:text-brand-sun font-bold text-xl px-2">→</button>
                            </div>
                            <div className="flex items-center gap-2 w-full sm:w-auto">
                                <button onClick={() => window.print()} className="bg-brand-wood dark:bg-gray-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-md hover:bg-brand-wood/90 dark:hover:bg-gray-600 transition flex items-center gap-1">

                                </button>
                                <div className="flex gap-1 flex-1">
                                    <input type="text" placeholder={t.journalAddChild} value={newChildName} onChange={e => setNewChildName(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAdd()} className="px-3 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg outline-none bg-white dark:bg-gray-900 text-brand-wood dark:text-white focus:ring-2 focus:ring-brand-sun w-full sm:w-40" />
                                    <button onClick={handleAdd} className="bg-brand-sun text-white px-3 py-1.5 rounded-lg font-bold text-sm hover:bg-brand-sun/90 transition shadow-sm">+</button>
                                </div>

                        </div>
                        <div className="overflow-x-auto no-scrollbar">
                            <table className="w-full text-center border-collapse min-w-max">
                                <thead>
                                    <tr className="bg-brand-cream/50 dark:bg-gray-800/50 border-b border-brand-wood/10 dark:border-gray-700">
                                        <th className="p-2 border-r border-brand-wood/10 dark:border-gray-700 font-bold text-brand-wood dark:text-gray-300 w-10 sticky left-0 bg-white/90 dark:bg-gray-900/90 backdrop-blur-sm z-10 text-xs">{t.thNo}</th>

                                        {daysArray.map(day => (

                                </thead>

                                    <button onClick={() => handleStatusSelect('cancelled')} className="w-14 h-14 bg-yellow-100 hover:bg-yellow-200 text-yellow-700 font-bold text-xl rounded-2xl border-2 border-yellow-300 transition-transform hover:scale-110 shadow-sm">О</button>
                                </div>
                                <button onClick={() => handleStatusSelect('pending')} className="mt-5 text-xs text-gray-500 hover:text-brand-red underline font-medium">{locale === 'ru' ? 'Очистить' : 'Clear'}</button>
                            </div>
                        </div>

                const days = [];

                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    days.push(d);
                }
                return days;
            }, [currentWeek]);

            const currentMonth = t.months[currentWeek.getMonth()];
            const currentYear = currentWeek.getFullYear();

            const changeWeek = (offset) => {
                const newWeek = new Date(currentWeek);
                newWeek.setDate(newWeek.getDate() + (offset * 7));
                setCurrentWeek(newWeek);
            };

            const getStatusStyle = (status) => {
                if (status === 'attended') return 'bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-300 border-green-300 dark:border-green-700';
                if (status === 'missed') return 'bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300 border-red-300 dark:border-red-700';
                if (status === 'cancelled') return 'bg-yellow-100 dark:bg-yellow-900/40 text-yellow-700 dark:text-yellow-300 border-yellow-300 dark:border-yellow-700';
                return 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 border-gray-300 dark:border-gray-600';
            };

            const getStatusText = (status) => {
                if (status === 'attended') return t.statusAttended;
                if (status === 'missed') return t.statusMissed;
                if (status === 'cancelled') return t.statusCancelled;
                return t.statusPending;
            };

            return (
                <div className="glass rounded-3xl overflow-hidden max-w-5xl mx-auto mt-6 animate-fade-in">

                        <h2 className="text-2xl font-cursive text-white drop-shadow-md">{currentMonth} {currentYear}</h2>
                        <button onClick={() => changeWeek(1)} className="bg-white/30 hover:bg-white/50 text-white px-4 py-2 rounded-xl font-bold transition">→</button>
                    </div>

                        <div className="p-3 border-r border-brand-wood/10 dark:border-gray-700">{t.dayCol}</div>
                        <div className="p-3 border-r border-brand-wood/10 dark:border-gray-700">{t.time}</div>
                        <div className="p-3 text-left pl-4">{t.childrenCol}</div>
                    </div>
                    <div className="divide-y divide-brand-wood/10 dark:divide-gray-700">
                        {weekDays.map((day, dayIndex) => {
                            const dateStr = formatDateObj(day);
                            const isToday = dateStr === formatDateObj(new Date());
                            return (
                                <div key={dateStr} className={`grid grid-cols-[80px_100px_1fr] sm:grid-cols-[120px_150px_1fr] ${isToday ? 'bg-brand-sun/10 dark:bg-brand-sun/5' : ''}`}>
                                    <div className={`p-3 flex flex-col items-center justify-center border-r border-brand-wood/10 dark:border-gray-700 ${isToday ? 'bg-brand-sun/20 dark:bg-brand-sun/20 font-bold text-brand-red dark:text-brand-sun' : 'bg-white/30 dark:bg-gray-800/30'}`}>
                                        <span className="font-bold text-sm sm:text-base">{t.weekDays[dayIndex]}</span>
                                        <span className="text-xs sm:text-sm">{day.getDate()}.{String(day.getMonth() + 1).padStart(2, '0')}</span>
                                    </div>
                                    <div className="col-span-2 flex flex-col divide-y divide-brand-wood/10 dark:divide-gray-700 bg-white/40 dark:bg-gray-900/40">
                                        {t.times.map((timeStr) => {
                                            const lesson = lessons.find(l => l.date === dateStr && l.timeSlot === timeStr);
                                            return (
                                                <div key={timeStr} className="flex min-h-[64px] hover:bg-white/60 dark:hover:bg-gray-800/60 transition-colors group">
                                                    <div className="w-[100px] sm:w-[150px] p-2 flex items-center justify-center border-r border-brand-wood/10 dark:border-gray-700 text-sm font-medium text-gray-600 dark:text-gray-400 shrink-0">{timeStr}</div>
                                                    <div className={`flex-1 p-2 flex flex-col gap-1 ${isMaster ? 'cursor-pointer' : ''}`} onClick={() => { if (isMaster) onSlotClick(dateStr, timeStr, lesson); }}>
                                                        {lesson && lesson.children && lesson.children.length > 0 ? (
                                                            lesson.children.map((childName, index) => {
                                                                const status = lesson.attendance?.[childName] || 'pending';
                                                                return (
                                                                    <div key={index} className="flex justify-between items-center bg-white/70 dark:bg-gray-800/70 px-2 py-1 rounded-lg border border-brand-wood/10 dark:border-gray-600 shadow-sm">
                                                                        <span className="font-semibold text-brand-wood dark:text-gray-200 text-sm">{childName}</span>
                                                                        {isMaster ? (
                                                                            <button onClick={(e) => { e.stopPropagation(); onToggleStatus(lesson.id, childName, status); }} className={`text-xs px-2 py-1 rounded-md border font-semibold transition hover:opacity-80 ${getStatusStyle(status)}`}>{getStatusText(status)}</button>
                                                                        ) : (
                                                                            <span className={`text-xs px-2 py-0.5 rounded-md border font-semibold ${getStatusStyle(status)}`}>{getStatusText(status)}</span>
                                                                        )}

                                                                </div>
                                                            )
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}

                        </div>

        function ReviewsTab({ locale, reviews, isMaster, currentUser, onAddReview }) {

            const [hover, setHover] = useState(0);
            const [showForm, setShowForm] = useState(false);

            const handleSubmit = () => {
                if (!text.trim()) return;
                onAddReview({ id: Date.now(), author: currentUser.name || 'Родитель', text, rating, date: new Date().toLocaleDateString('ru-RU'), avatar: currentUser.avatar });
                setText('');
                setRating(5);
                setShowForm(false);

        function App() {
            const [locale, setLocale] = useState('ru');
            const [page, setPage] = useState('home');
            const [currentWeek, setCurrentWeek] = useState(new Date());
            const [journalDate, setJournalDate] = useState(new Date());
            const [parentTab, setParentTab] = useState('children');
            const [adminTab, setAdminTab] = useState('dashboard');
            const [isChatOpen, setIsChatOpen] = useState(false);
            const t = translations[locale];

            const [masterProfile, setMasterProfile] = useState({ name: 'Мастер Ясна', phone: '', avatar: null });
            const [parentProfile, setParentProfile] = useState({ name: '', phone: '', avatar: null });

            const [isDarkMode, setIsDarkMode] = useState(false);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            const todayStr = formatDateObj(new Date());
            const [lessons, setLessons] = useState([
                { id: 'init1', date: todayStr, timeSlot: '10:00-12:00', children: [], attendance: {} }
            ]);
            const [childrenList, setChildrenList] = useState([]);
            const [payments, setPayments] = useState([]);
            const [payingChild, setPayingChild] = useState(null);
            const [masterNotes, setMasterNotes] = useState({});
            const [dismissedParentNotifs, setDismissedParentNotifs] = useState([]);
            const [masterNotifs, setMasterNotifs] = useState([]);
            const [galleryImages, setGalleryImages] = useState([]);
            const [messages, setMessages] = useState([]);
            const [reviews, setReviews] = useState([]);

            const handleSendMessage = (text) => {
                const newMsg = {
                    id: Date.now(),
                    sender: page === 'admin' || page === 'profile-master' ? 'master' : 'parent',
                    text,
                    time: new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'})
                };
                setMessages(prev => [...prev, newMsg]);
            };

            const handleAddGalleryImage = (base64) => setGalleryImages(prev => [base64, ...prev]);
            const handleDeleteGalleryImage = (index) => setGalleryImages(prev => prev.filter((_, i) => i !== index));

            const parentNotifications = childrenList
                .filter(c => c.balance <= 3 && !dismissedParentNotifs.includes(c.id))
                .map(c => ({ id: c.id, type: 'balance', text: t.lowBalanceAlert.replace('{name}', c.name).replace('{balance}', c.balance) }));

            childrenList.forEach(c => {
                if (c.birthday) {
                    const bday = new Date(c.birthday);
                    const today = new Date();
                    bday.setFullYear(today.getFullYear());
                    if (bday < today) bday.setFullYear(today.getFullYear() + 1);
                    const diffDays = Math.ceil((bday - today) / (1000 * 60 * 60 * 24));
                    if (diffDays >= 0 && diffDays <= 7 && !dismissedParentNotifs.includes(`bday_${c.id}`)) {
                        parentNotifications.push({ id: `bday_${c.id}`, type: 'birthday', text: t.birthdayAlert.replace('{name}', c.name) });
                    }
                }
            });

            const handleDeleteParentNotification = (id) => setDismissedParentNotifs([...dismissedParentNotifs, id]);

            const addLesson = (newLesson) => setLessons([...lessons, newLesson]);
            const updateLesson = (id, newChildren, newAttendance) => {
                setLessons(lessons.map(l => l.id === id ? { ...l, children: newChildren, attendance: newAttendance } : l));
            };

            const handleToggleStatus = (lessonId, childName, currentStatus) => {
                let newStatus = 'pending';
                let balanceDiff = 0;

                if (currentStatus === 'pending') { newStatus = 'attended'; balanceDiff = -1; }
                else if (currentStatus === 'attended') { newStatus = 'missed'; balanceDiff = 0; }
                else if (currentStatus === 'missed') { newStatus = 'cancelled'; balanceDiff = 0; }
                else if (currentStatus === 'cancelled') { newStatus = 'pending'; balanceDiff = 1; }

                setChildrenList(prev => prev.map(child => {
                    if (child.name.toLowerCase() === childName.toLowerCase()) {
                        return { ...child, balance: Math.max(0, child.balance + balanceDiff) };
                    }
                    return child;
                }));

                setLessons(prev => prev.map(lesson => {
                    if (lesson.id === lessonId) {
                        return { ...lesson, attendance: { ...lesson.attendance, [childName]: newStatus } };
                    }
                    return lesson;
                }));
            };

            const handlePaymentSuccess = (paymentData) => {
                setChildrenList(prev => prev.map(child => {
                    if (child.id === paymentData.childId) {
                        return { ...child, balance: child.balance + paymentData.lessons };
                    }
                    return child;
                }));
                setPayments(prev => [paymentData, ...prev]);
                setDismissedParentNotifs(prev => prev.filter(id => id !== paymentData.childId));

                setMasterNotifs(prev => [{
                    id: Date.now(),
                    text: t.newPaymentAlert.replace('{amount}', paymentData.amount).replace('{name}', paymentData.childName),
                    date: new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'})
                }, ...prev]);
            };

            const handleAddReview = (review) => {
                setReviews(prev => [review, ...prev]);
            };

            const handleLogout = () => {
                setPage('home');
                setParentTab('children');
                setAdminTab('dashboard');
                setMasterProfile(prev => ({ ...prev, avatar: null }));
                setParentProfile(prev => ({ ...prev, avatar: null }));
            };

            let content;
            switch (page) {
                case 'admin': content = <AdminPage locale={locale} lessons={lessons} addLesson={addLesson} updateLesson={updateLesson} currentWeek={currentWeek} setCurrentWeek={setCurrentWeek} onToggleStatus={handleToggleStatus} childrenList={childrenList} setChildrenList={setChildrenList} payments={payments} journalDate={journalDate} setJournalDate={setJournalDate} masterNotes={masterNotes} setMasterNotes={setMasterNotes} masterNotifs={masterNotifs} activeTab={adminTab} setActiveTab={setAdminTab} galleryImages={galleryImages} onAddGalleryImage={handleAddGalleryImage} onDeleteGalleryImage={handleDeleteGalleryImage} messages={messages} onSendMessage={handleSendMessage} masterProfile={masterProfile} parentProfile={parentProfile} reviews={reviews} />; break;
                case 'parent-cabinet': content = <ParentCabinetPage locale={locale} lessons={lessons} childrenList={childrenList} setChildrenList={setChildrenList} currentWeek={currentWeek} setCurrentWeek={setCurrentWeek} onBack={() => setPage('home')} payments={payments} onBuyClick={setPayingChild} activeTab={parentTab} setActiveTab={setParentTab} notifications={parentNotifications} onDeleteNotification={handleDeleteParentNotification} galleryImages={galleryImages} isChatOpen={isChatOpen} setIsChatOpen={setIsChatOpen} messages={messages} onSendMessage={handleSendMessage} masterProfile={masterProfile} parentProfile={parentProfile} reviews={reviews} onAddReview={handleAddReview} />; break;
                case 'finance': content = <FinancePage locale={locale} payments={payments} childrenList={childrenList} lessons={lessons} onBack={() => setPage('admin')} />; break;
                case 'profile-master': content = <ProfilePage locale={locale} userProfile={masterProfile} setUserProfile={setMasterProfile} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} onBack={() => setPage('admin')} onLogout={handleLogout} isMaster={true} />; break;
                case 'profile-parent': content = <ProfilePage locale={locale} userProfile={parentProfile} setUserProfile={setParentProfile} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} onBack={() => setPage('parent-cabinet')} onLogout={handleLogout} isMaster={false} />; break;
                case 'role-select': content = <RoleSelectPage locale={locale} onSelect={setPage} onBack={() => setPage('home')} />; break;
                case 'login-master': content = <MasterLoginPage locale={locale} onLogin={() => setPage('admin')} onBack={() => setPage('role-select')} />; break;
                case 'login-parent': content = <ParentLoginPage
                    locale={locale}
                    onLogin={(data) => {
                        setParentProfile(prev => ({ ...prev, name: data.name, phone: data.phone }));
                        setPage('parent-cabinet');
                    }}
                    onBack={() => setPage('role-select')}
                />; break;
                default: content = <LandingPage locale={locale} onGoHome={setPage} onGoLogin={setPage} />;
            }

            const isActuallyLoggedIn = ['admin', 'finance', 'parent-cabinet', 'profile-master', 'profile-parent'].includes(page);

            return (
                <div>
                    <Header
                        locale={locale}
                        setLocale={setLocale}
                        isLoggedIn={isActuallyLoggedIn}
                        onLogout={handleLogout}
                        onGoHome={(target) => setPage(target || 'home')}
                        isMaster={page === 'admin' || page === 'finance' || page === 'profile-master'}
                        onGoFinance={() => setPage('finance')}
                        notificationsCount={page === 'parent-cabinet' ? parentNotifications.length : masterNotifs.length}
                        onGoNotifications={() => {
                            if (page === 'parent-cabinet' || page === 'profile-parent') {
                                setPage('parent-cabinet'); setParentTab('notifications');
                            } else if (page === 'admin' || page === 'profile-master') {
                                setPage('admin'); setAdminTab('notifications');
                            }
                        }}
                        onGoProfile={() => {
                            if (page === 'parent-cabinet' || page === 'profile-parent') setPage('profile-parent');
                            else setPage('profile-master');
                        }}
                        userProfile={page === 'profile-parent' || page === 'parent-cabinet' ? parentProfile : masterProfile}
                    />
                    <main className={page === 'home' ? "" : "container mx-auto px-4 py-8 relative"}>
                        {content}
                        <PaymentModal locale={locale} isOpen={!!payingChild} child={payingChild} onClose={() => setPayingChild(null)} onSuccess={handlePaymentSuccess} />
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
